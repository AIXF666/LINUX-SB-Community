<!doctype html>
<html lang="zh-CN" data-sb-view="home"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINUX SB · 客户端设计预览</title><style>
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}#phone{position:relative;max-width:430px;margin:24px auto;border-radius:32px;overflow:hidden;box-shadow:0 20px 80px #17212d15;height:calc(100dvh - 70px);min-height:580px;background:var(--sb-bg)}#scroll{height:100%;overflow:auto;padding-bottom:100px}#sb-client-shell{position:sticky;top:0;z-index:5}.sb-client-title{display:flex;align-items:center;justify-content:space-between}.sb-client-title button{display:grid;place-items:center}.sb-client-tools{display:flex}.sb-client-search{flex:1}.post-list{list-style:none;padding:0}.post-item{display:flex;gap:12px}.post-body{flex:1;min-width:0}.post-title{margin:0 0 8px}.post-avatar,.avatar-profile-link{width:42px;height:42px;flex:none;border-radius:50%;background:#e8eef6;display:grid;place-items:center;color:#334155}.post-head{display:flex;flex-wrap:wrap;gap:6px}.post-entry{display:block!important}.post-entry .post-avatar{float:left;margin-right:12px}.post-entry .post-meta{clear:both;padding-top:15px}.post-entry .post-content{clear:both}.topic-op-badge{background:#edf2f7}.topic-post-list{padding:0}.post-topic-title h1{margin:0}.sb-replies-heading{padding:16px 24px;font-size:18px;font-weight:650}#sb-client-tabs{position:absolute;z-index:10;display:flex;justify-content:space-around}#sb-client-tabs a{display:grid;place-items:center}.sb-client-account-head{padding:22px}.sb-client-account-links{display:grid;grid-template-columns:1fr 1fr;margin-top:16px}.sb-client-account-links a{padding:16px;border-bottom:1px solid var(--sb-line)}.sb-client-category-grid{display:grid;grid-template-columns:1fr 1fr}.search-form{display:flex;gap:8px}.search-form input{min-width:0;flex:1}.notice{text-align:center;font-size:11px;color:#7b8796;margin:10px}pre{overflow:auto;background:var(--sb-soft);border-radius:14px;padding:14px;font-size:12px}#hint{position:absolute;bottom:100px;left:24px;right:24px;border-radius:16px;background:#334155;color:white;padding:12px;font-size:13px;z-index:20;display:none}@media(max-width:500px){#phone{margin:0;border-radius:0;height:100dvh}.notice{display:none}}
/* APP_DESIGN_CSS */
</style></head><body><main id="phone"><div id="scroll"><header id="sb-client-shell"><div class="sb-client-title"><button onclick="screen('home')" aria-label="返回">‹</button><strong id="title">LINUX SB</strong><button onclick="hint()" aria-label="编辑">＋</button></div><nav class="sb-client-links"> <a onclick="hint()">用户榜单</a><a onclick="hint()">邀请中心</a><a onclick="hint()">称号中心</a><a onclick="hint()">淘帖中心</a><a onclick="hint()">认证中心</a></nav><div class="sb-client-tools"><a class="sb-client-search" onclick="screen('search')">⌕　搜索社区</a></div></header><section id="content" class="forum-main"></section></div><nav id="sb-client-tabs"></nav><div id="hint" role="status">这是示例预览；App 使用网站真实功能。</div></main><p class="notice">与 App 共用设计样式 · 所有内容均为示例数据</p><script>
const pages={home:'话题',categories:'分类',search:'搜索',messages:'消息',profile:'我的'};
const avatar=name=>`<div class="post-avatar">${name.slice(0,1)}</div>`;
const post=(name,text,child=false)=>`<li class="post-item post-entry ${child?'quote-threads-child quote-threads-thread-end':'quote-threads-thread-item'}">${avatar(name)}<div class="post-head"><strong class="post-author">${name}</strong><span class="topic-op-badge">社区成员</span></div><div class="post-meta">今天　${child?'↳ 回复 #2':'#2'}</div><div class="post-content">${text}</div><button onclick="hint()">回复</button></li>`;
function hint(){const h=document.getElementById('hint');h.style.display='block';setTimeout(()=>h.style.display='none',2200)}
function screen(view){document.documentElement.dataset.sbView=view;document.getElementById('title').textContent=view==='home'?'LINUX SB':view==='topic'?'话题':pages[view];document.getElementById('sb-client-tabs').innerHTML=Object.entries(pages).map(([key,label])=>`<a class="${key===view?'active':''}" onclick="screen('${key}')">${label}</a>`).join('');const c=document.getElementById('content');
if(view==='home')c.innerHTML=`<div class="sb-home-intro"><h1>社区动态</h1></div><nav class="sb-client-filters">${['新评论','新帖子','精华','抽奖','发卡','红包','足迹','申请'].map((x,i)=>`<a class="${i===0?'active':''}" onclick="this.parentNode.querySelector('.active')?.classList.remove('active');this.classList.add('active')">${x}</a>`).join('')}</nav><div class="main-panel"><ul class="post-list">${['欢迎加入 LINUX SB 社区','让每天的学习更有收获','分享你的开源项目','一个简单、可靠的小工具'].map((x,i)=>`<li class="post-item" onclick="screen('topic')">${avatar('S')}<div class="post-body"><h3 class="post-title" style="color:${i===0?'#7c3aed':i===1?'#2563eb':'var(--sb-text)'}">${x}</h3><div class="post-meta">社区成员　·　${i+2} 条回复　·　刚刚</div></div></li>`).join('')}</ul></div>`;
if(view==='topic')c.innerHTML=`<div class="main-panel"><div class="post-topic-title"><h1 class="post-content-title">让每天的学习更有收获</h1><div class="post-content-stats">技术交流　·　2 条回复</div></div><ul class="topic-post-list"><li class="post-item post-entry">${avatar('S')}<div class="post-head"><strong class="post-author">社区成员</strong><span class="topic-op-badge">楼主</span></div><div class="post-meta">今天　#1</div><div class="post-content">保持简单，记录进步。分享你的经验，也听听别人的想法。<pre><code># Markdown\n标题、引用、代码与图片</code></pre></div></li><li class="sb-replies-heading">全部回复</li>${post('纸飞机','这张卡片里的回复属于同一个讨论。')}${post('小麦','回复 @纸飞机：同意，交流应该清晰又轻松。',true)}</ul></div>`;
if(view==='search')c.innerHTML='<div class="main-panel"><form class="search-form" onsubmit="event.preventDefault();hint()"><input type="search" aria-label="搜索帖子" placeholder="搜索话题和帖子"><button type="submit">搜索</button></form><h2>最近搜索</h2><div class="card">Markdown 排版</div><div class="card">开源项目</div></div>';
if(view==='messages')c.innerHTML=`<div class="main-panel"><h2>通知</h2><ul class="post-list">${['纸飞机','小麦','社区助手'].map((x,i)=>`<li class="post-item" onclick="screen('topic')">${avatar(x)}<div class="post-body"><strong>${x}</strong><p>${['回复了你的评论','提到了你','帖子已通过审核'][i]}</p><div class="post-meta">今天</div></div></li>`).join('')}</ul></div>`;
if(view==='categories')c.innerHTML=`<div class="main-panel"><div class="sb-client-category-grid">${['技术交流','资源分享','求助问答','社区公告'].map(x=>`<a onclick="screen('home')">${x}</a>`).join('')}</div></div>`;
if(view==='profile')c.innerHTML=`<div class="main-panel"><div class="sb-client-account-head">${avatar('S')}<h2>社区成员</h2><p>记录学习，分享创造。</p><button onclick="hint()">编辑资料</button></div><div class="sb-client-account-links">${['我的主题','我的回帖','我的附件','社区活跃度','我的烧饼','我的称号','我的积分','我的签名','我的广告','我的淘帖','我的收藏','屏蔽名单','我的隐私','我的通知','个人设置'].map(x=>`<a onclick="hint()">${x}　›</a>`).join('')}</div></div>`;
document.getElementById('scroll').scrollTop=0;}screen('home');
</script></body></html>
