name: Publish unsigned IPA to GitHub Packages
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing Release IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.1.0-preview --repo "$GITHUB_REPOSITORY" --pattern 'LINUX-SB-Community-2.1.0-unsigned.ipa'
      - name: Authenticate to Container registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish IPA archive container
        run: |
          docker build -f packaging/Dockerfile -t ghcr.io/aixf666/linux-sb-community:2.1.0-preview .
          docker push ghcr.io/aixf666/linux-sb-community:2.1.0-preview
